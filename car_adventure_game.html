<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Весёлые Горки</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2B2140;
    --red: #FF4757;
    --yellow: #FFA502;
    --green: #2ED573;
    --blue: #1E90FF;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    min-height: 100%;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    background: #60A5FA;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* Верхняя панель */
  .top-bar {
    position: absolute;
    top: max(env(safe-area-inset-top, 0px), 8px);
    left: max(env(safe-area-inset-left, 0px), 12px);
    right: max(env(safe-area-inset-right, 0px), 12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFFFFE8;
    border: 3px solid var(--ink);
    border-radius: 99px;
    color: var(--ink);
    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
    pointer-events: auto;
    font-family: 'Comfortaa', cursive;
    font-weight: 700;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--ink);
  }

  .btn-icon {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    text-decoration: none;
  }

  /* Индикатор прогресса трассы */
  .progress-wrap {
    background: #FFFFFFE6;
    border: 3px solid var(--ink);
    border-radius: 99px;
    padding: 6px 18px;
    box-shadow: 0 4px 0 var(--ink);
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
  }

  .progress-track {
    width: 140px;
    height: 12px;
    background: #E2E8F0;
    border-radius: 99px;
    border: 2px solid var(--ink);
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FFA502, #2ED573);
    border-radius: 99px;
    transition: width 0.15s ease;
  }

  .progress-text {
    font-family: 'Comfortaa', cursive;
    font-size: 15px;
    font-weight: 900;
    white-space: nowrap;
  }

  /* Счётчик звёзд */
  .score-badge {
    background: #FFFFFFE6;
    border: 3px solid var(--ink);
    border-radius: 99px;
    padding: 6px 16px;
    box-shadow: 0 4px 0 var(--ink);
    font-family: 'Comfortaa', cursive;
    font-size: 18px;
    font-weight: 900;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Подсказка снизу в начале */
  .hint-toast {
    position: absolute;
    bottom: max(env(safe-area-inset-bottom, 0px), 16px);
    left: 50%;
    transform: translateX(-50%);
    background: #FFFFFFF0;
    border: 3px solid var(--ink);
    border-radius: 99px;
    padding: 8px 24px;
    font-family: 'Comfortaa', cursive;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 4px 0 var(--ink);
    z-index: 10;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.5s ease;
  }

  /* Праздничное окно финиша */
  .modal-overlay {
    position: absolute;
    inset: 0;
    background: rgba(43, 33, 64, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .win-card {
    background: #FFFDF7;
    border: 4px solid var(--ink);
    border-radius: 32px;
    box-shadow: 0 10px 0 var(--ink);
    padding: 30px 24px;
    width: 100%;
    max-width: 480px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes popIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .cup-icon {
    font-size: 76px;
    line-height: 1;
    animation: bounceCup 1.2s infinite ease-in-out;
  }

  @keyframes bounceCup {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px) rotate(4deg); }
  }

  .stars-row {
    font-size: 34px;
    letter-spacing: 6px;
  }

  .win-title {
    font-family: 'Comfortaa', cursive;
    font-size: 26px;
    font-weight: 900;
    color: var(--ink);
  }

  .win-desc {
    font-size: 16px;
    font-weight: 800;
    color: #4B5563;
  }

  .win-actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 300px;
    margin-top: 8px;
  }

  .restart-btn {
    background: #2ED573;
    color: #FFF;
    border-color: var(--ink);
    font-size: 19px;
    padding: 14px 20px;
    text-shadow: 0 2px 0 var(--ink);
    gap: 8px;
  }

  .exit-btn {
    text-decoration: none;
    font-size: 15px;
    padding: 10px 18px;
    background: #F3F4F6;
  }
</style>
</head>
<body>

<div id="app">
  <div class="top-bar">
    <a href="index.html" class="btn btn-icon" title="В меню">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>

    <div class="progress-wrap">
      <span>🚗</span>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span>🏁</span>
      <span class="progress-text" id="distanceText">6800 м</span>
    </div>

    <div class="score-badge">
      <span>⭐</span>
      <span id="starCount">0</span>
    </div>
  </div>

  <div class="hint-toast" id="hintToast">
    Держи палец, чтобы ехать! 🚀 Тяни вверх, чтобы прыгать! 🦘
  </div>

  <canvas id="gameCanvas"></canvas>

  <!-- Праздничное окно победы на финише -->
  <div class="modal-overlay hidden" id="winModal">
    <div class="win-card">
      <div class="cup-icon">🏆</div>
      <div class="stars-row">⭐⭐⭐</div>
      <div class="win-title">УРА! ФИНИШ! 🎉</div>
      <div class="win-desc" id="winStatsText">Ты собрал много звёздочек и доехал до финиша!</div>

      <div class="win-actions">
        <button class="btn restart-btn" id="restartBtn">
          <span>🔄</span>
          <span>Ехать ещё раз!</span>
        </button>
        <a href="index.html" class="btn exit-btn">
          ⬅ Выйти в главное меню
        </a>
      </div>
    </div>
  </div>
</div>

<script>
// --- ЗВУКОВОЙ ДВИЖОК (Web Audio API) ---
class SoundFX {
  constructor() {
    this.ctx = null;
    this.lastPopTime = 0;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  // Прыжок («Вжух-хоп!»)
  jump() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(260, now);
    osc.frequency.exponentialRampToValueAtTime(720, now + 0.18);
    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.2);
  }
  // Лопание воздушного шарика
  pop() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    if (now - this.lastPopTime < 0.08) return;
    this.lastPopTime = now;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(650, now);
    osc.frequency.exponentialRampToValueAtTime(160, now + 0.09);
    gain.gain.setValueAtTime(0.3, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.1);
  }
  // Звёздочка («Дзынь!»)
  star() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(750, now);
    osc.frequency.exponentialRampToValueAtTime(1300, now + 0.12);
    gain.gain.setValueAtTime(0.24, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.16);
  }
  // Победный фанфарный аккорд при финише
  win() {
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const melody = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
    melody.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.1);
      gain.gain.setValueAtTime(0.32, now + i * 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.55);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now + i * 0.1);
      osc.stop(now + i * 0.1 + 0.55);
    });
  }
}

const sfx = new SoundFX();

// --- ПЕРЕМЕННЫЕ И ХОЛСТ ---
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const progressFill = document.getElementById('progressFill');
const distanceText = document.getElementById('distanceText');
const starCountEl = document.getElementById('starCount');
const hintToast = document.getElementById('hintToast');
const winModal = document.getElementById('winModal');
const restartBtn = document.getElementById('restartBtn');
const winStatsText = document.getElementById('winStatsText');

let width = window.innerWidth;
let height = window.innerHeight;
let dpr = window.devicePixelRatio || 1;

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  dpr = window.devicePixelRatio || 1;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.scale(dpr, dpr);
}
window.addEventListener('resize', resize);
resize();

// Скрываем подсказку через 5 секунд
setTimeout(() => {
  hintToast.style.opacity = '0';
}, 5000);

// Длина трассы: длинная и интересная (6800м)
const FINISH_DISTANCE = 6800;

let starsCollected = 0;
let isGasPressed = false;
let pointerStartY = 0;
let hasJumpedThisTouch = false;
let particles = [];

// Машинка
const car = {
  worldX: 80,
  screenX: 180,
  y: 0,
  vy: 0,
  speed: 0,
  maxSpeed: 10.5,
  angle: 0,
  isOnGround: true,
  wheelR: 19,
  bodyW: 68,
  bodyH: 36,
  finished: false,
  finishStopX: 0
};

let balloons = [];
let stars = [];

// Процедурные холмы и трамплины
function getGroundY(worldX) {
  const base = height * 0.7;

  // Плавные холмы + трамплины
  const hill1 = Math.sin(worldX * 0.0035) * 65;
  const hill2 = Math.cos(worldX * 0.009) * 35;
  const wave = Math.sin(worldX * 0.0012) * 20;

  // Перед финишем (за 250м до конца) делаем ровную финишную площадку
  if (worldX > FINISH_DISTANCE - 200) {
    return base;
  }

  return base + hill1 + hill2 + wave;
}

function initGame() {
  car.worldX = 80;
  car.speed = 0;
  car.vy = 0;
  car.angle = 0;
  car.isOnGround = true;
  car.finished = false;
  car.finishStopX = 0;
  car.y = getGroundY(car.worldX) - car.wheelR;

  starsCollected = 0;
  starCountEl.textContent = '0';
  progressFill.style.width = '0%';
  distanceText.textContent = `${FINISH_DISTANCE} м`;
  particles = [];

  winModal.classList.add('hidden');

  // Расставляем воздушные шарики и звёзды вдоль длинной трассы
  balloons = [];
  stars = [];

  for (let x = 350; x < FINISH_DISTANCE - 300; x += 160) {
    const gy = getGroundY(x);
    const heightOffset = 45 + Math.sin(x * 0.015) * 45; // прямо на пути и в прыжке

    // Чередуем шарики и звёздочки
    if (Math.random() < 0.65) {
      balloons.push({
        worldX: x,
        y: gy - heightOffset,
        color: ['#FF4757', '#FFA502', '#2ED573', '#1E90FF', '#9B59B6'][Math.floor(Math.random() * 5)],
        radius: 20,
        collected: false
      });
    } else {
      stars.push({
        worldX: x,
        y: gy - heightOffset + 10,
        radius: 18,
        collected: false
      });
    }
  }
}

// Прыжок
function performJump() {
  if (car.finished) return;
  if (car.isOnGround) {
    sfx.jump();
    car.vy = -12.5; // Высокий сочный прыжок
    car.speed = Math.max(car.speed, 4.0); // толчок вперёд
    car.isOnGround = false;

    // Пыль из-под колёс
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: car.screenX + (Math.random() - 0.5) * 30,
        y: car.y + car.wheelR,
        vx: (Math.random() - 0.5) * 6,
        vy: 1 + Math.random() * 3,
        color: '#A16207',
        size: 6,
        life: 0.6
      });
    }
  }
}

// --- УПРАВЛЕНИЕ: 100% ЖЕСТОВОЕ ДЛЯ МАЛЫША ---
// Любое касание экрана = ГАЗ и движение вперед!
// Тянуть вверх = ПРЫЖОК!
canvas.addEventListener('pointerdown', (e) => {
  sfx.init();
  if (car.finished) return;
  isGasPressed = true;
  pointerStartY = e.clientY;
  hasJumpedThisTouch = false;
});

canvas.addEventListener('pointermove', (e) => {
  if (car.finished) return;
  if (isGasPressed) {
    const deltaY = pointerStartY - e.clientY;
    // Потянули пальцем вверх на 22px — прыжок!
    if (!hasJumpedThisTouch && deltaY > 22) {
      performJump();
      hasJumpedThisTouch = true;
    } else if (deltaY < 8) {
      // Опустили обратно — можно прыгнуть повторно
      hasJumpedThisTouch = false;
    }
  }
});

window.addEventListener('pointerup', () => {
  isGasPressed = false;
  hasJumpedThisTouch = false;
});

// Кнопка рестарта в окне победы
restartBtn.addEventListener('click', () => {
  sfx.init();
  initGame();
});

// Салют на финише
function spawnConfetti(x, y) {
  const colors = ['#FF4757', '#FFA502', '#2ED573', '#1E90FF', '#9B59B6', '#FFD200'];
  for (let i = 0; i < 75; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 9;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 8 + Math.random() * 8,
      life: 1.4,
      rot: Math.random() * Math.PI,
      vRot: (Math.random() - 0.5) * 0.2
    });
  }
}

// Обновление физики
function update() {
  if (car.finished) {
    // На финише плавно тормозим
    car.speed *= 0.94;
    car.worldX += car.speed;
    const gy = getGroundY(car.worldX);
    car.y = gy - car.wheelR;
    car.angle *= 0.9;
    return;
  }

  // Разгон при удержании экрана
  if (isGasPressed) {
    car.speed += 0.32;
    if (car.speed > car.maxSpeed) car.speed = car.maxSpeed;
  } else {
    car.speed *= 0.985;
  }

  car.worldX += car.speed;

  // Высота земли под передним и задним колесом
  const groundFront = getGroundY(car.worldX + 28);
  const groundBack = getGroundY(car.worldX - 28);
  const groundCenter = (groundFront + groundBack) / 2;
  const slopeAngle = Math.atan2(groundFront - groundBack, 56);

  // Физика прыжка и падения (гравитация)
  car.vy += 0.52;
  car.y += car.vy;

  // Касание земли
  if (car.y >= groundCenter - car.wheelR) {
    car.y = groundCenter - car.wheelR;
    car.isOnGround = true;

    // Взлёт на вершинах холмов на высокой скорости
    if (car.speed > 6.0 && slopeAngle < -0.15 && car.vy < 0) {
      car.vy -= car.speed * 0.5; // выброс в воздух!
      car.isOnGround = false;
      sfx.jump();
    } else {
      car.vy = 0;
    }

    // Выравнивание по склону
    car.angle += (slopeAngle - car.angle) * 0.22;
  } else {
    car.isOnGround = false;
    car.angle += (0 - car.angle) * 0.04;
  }

  // Прогресс трассы
  const progressRatio = Math.min(1, car.worldX / FINISH_DISTANCE);
  progressFill.style.width = `${progressRatio * 100}%`;
  const distLeft = Math.max(0, Math.round(FINISH_DISTANCE - car.worldX));
  distanceText.textContent = `${distLeft} м`;

  // ПЕРЕСЕЧЕНИЕ ФИНИША! 🏁
  if (car.worldX >= FINISH_DISTANCE && !car.finished) {
    car.finished = true;
    sfx.win();
    spawnConfetti(width * 0.5, height * 0.35);

    // Через 1 секунду открываем праздничное окно победы
    setTimeout(() => {
      winStatsText.textContent = `Ты собрал ${starsCollected} звёздочек и кубок теперь твой! 🏆`;
      winModal.classList.remove('hidden');
    }, 1100);
  }

  // Лопание шариков
  const camX = car.worldX - car.screenX;
  for (const b of balloons) {
    if (!b.collected) {
      const bx = b.worldX - camX;
      if (Math.hypot(car.screenX - bx, car.y - b.y) < car.bodyW * 0.6 + b.radius) {
        b.collected = true;
        starsCollected++;
        starCountEl.textContent = starsCollected;
        sfx.pop();

        for (let i = 0; i < 8; i++) {
          particles.push({
            x: bx,
            y: b.y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            color: b.color,
            size: 7,
            life: 0.7
          });
        }
      }
    }
  }

  // Сбор звёздочек
  for (const s of stars) {
    if (!s.collected) {
      const sx = s.worldX - camX;
      if (Math.hypot(car.screenX - sx, car.y - s.y) < car.bodyW * 0.6 + s.radius) {
        s.collected = true;
        starsCollected++;
        starCountEl.textContent = starsCollected;
        sfx.star();

        for (let i = 0; i < 7; i++) {
          particles.push({
            x: sx,
            y: s.y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            color: '#FFD166',
            size: 6,
            life: 0.7
          });
        }
      }
    }
  }

  // Дым из трубы при газе
  if (isGasPressed && Math.random() < 0.35) {
    particles.push({
      x: car.screenX - 35,
      y: car.y + 8,
      vx: -car.speed * 0.6 - Math.random() * 2,
      vy: -1 - Math.random(),
      size: 10 + Math.random() * 8,
      color: '#FFFFFF88',
      life: 0.6
    });
  }
}

// Отрисовка
function draw() {
  // Небо
  const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
  skyGrad.addColorStop(0, '#60A5FA');
  skyGrad.addColorStop(1, '#BFDBFE');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, width, height);

  // Солнышко
  ctx.fillStyle = '#FDE047';
  ctx.beginPath();
  ctx.arc(width - 80, 80, 42, 0, Math.PI * 2);
  ctx.fill();

  const camX = car.worldX - car.screenX;

  // Отрисовка холмов (Трава)
  ctx.fillStyle = '#4ADE80';
  ctx.strokeStyle = '#2B2140';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (let x = 0; x <= width; x += 15) {
    const wx = x + camX;
    ctx.lineTo(x, getGroundY(wx));
  }
  ctx.lineTo(width, height);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Земля под травой (коричневый срез)
  ctx.fillStyle = '#A1620744';
  ctx.beginPath();
  ctx.moveTo(0, height);
  for (let x = 0; x <= width; x += 15) {
    const wx = x + camX;
    ctx.lineTo(x, getGroundY(wx) + 26);
  }
  ctx.lineTo(width, height);
  ctx.closePath();
  ctx.fill();

  // Воздушные шарики
  for (const b of balloons) {
    if (!b.collected) {
      const bx = b.worldX - camX;
      if (bx > -40 && bx < width + 40) {
        ctx.strokeStyle = '#64748B';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(bx, b.y + b.radius);
        ctx.lineTo(bx, b.y + b.radius + 22);
        ctx.stroke();

        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.ellipse(bx, b.y, b.radius, b.radius * 1.25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#2B2140';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#FFFFFF99';
        ctx.beginPath();
        ctx.arc(bx - 5, b.y - 7, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // Звёздочки
  for (const s of stars) {
    if (!s.collected) {
      const sx = s.worldX - camX;
      if (sx > -40 && sx < width + 40) {
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⭐', sx, s.y);
      }
    }
  }

  // ФИНИШНАЯ АРКА И ПЬЕДЕСТАЛ 🏁🏆
  const finishX = FINISH_DISTANCE - camX;
  if (finishX > -120 && finishX < width + 120) {
    const fGroundY = getGroundY(FINISH_DISTANCE);

    // Пьедестал почёта за аркой
    ctx.fillStyle = '#F59E0B';
    ctx.fillRect(finishX + 90, fGroundY - 40, 110, 40);
    ctx.fillStyle = '#2B2140';
    ctx.lineWidth = 3;
    ctx.strokeRect(finishX + 90, fGroundY - 40, 110, 40);
    ctx.font = '24px sans-serif';
    ctx.fillText('🏆 1', finishX + 125, fGroundY - 12);

    // Столбы финишной арки
    ctx.fillStyle = '#EF476F';
    ctx.fillRect(finishX - 10, fGroundY - 150, 16, 150);
    ctx.fillRect(finishX + 55, fGroundY - 150, 16, 150);

    // Шашечный плакат
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(finishX - 10, fGroundY - 150, 81, 32);
    ctx.fillStyle = '#2B2140';
    for (let r = 0; r < 2; r++) {
      for (let c = 0; c < 5; c++) {
        if ((r + c) % 2 === 0) ctx.fillRect(finishX - 10 + c * 16, fGroundY - 150 + r * 16, 16, 16);
      }
    }

    // Красная финишная ленточка (разрывается, когда проехали)
    if (!car.finished) {
      ctx.strokeStyle = '#FF4757';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(finishX - 10, fGroundY - 35);
      ctx.lineTo(finishX + 65, fGroundY - 35);
      ctx.stroke();
    }

    // Надпись ФИНИШ
    ctx.font = 'bold 22px Nunito';
    ctx.fillStyle = '#2B2140';
    ctx.fillText('🏁 ФИНИШ 🏁', finishX - 18, fGroundY - 160);
  }

  // Машинка
  ctx.save();
  ctx.translate(car.screenX, car.y);
  ctx.rotate(car.angle);

  // Тень
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(0, 16, 38, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // Кузов
  ctx.fillStyle = '#FF4757';
  ctx.beginPath();
  ctx.roundRect(-34, -22, 68, 28, 10);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = '#2B2140';
  ctx.stroke();

  // Кабина
  ctx.fillStyle = '#E0F2FE';
  ctx.beginPath();
  ctx.roundRect(-12, -38, 30, 20, 6);
  ctx.fill();
  ctx.stroke();

  // Глазки
  ctx.fillStyle = '#2B2140';
  ctx.beginPath();
  ctx.arc(10, -30, 3, 0, Math.PI * 2);
  ctx.fill();

  // Улыбочка
  ctx.strokeStyle = '#2B2140';
  ctx.beginPath();
  ctx.arc(24, -10, 4, 0.2, Math.PI - 0.2);
  ctx.stroke();

  // Колеса
  const wheelSpin = car.worldX * 0.1;
  function drawWheel(wx, wy) {
    ctx.save();
    ctx.translate(wx, wy);
    ctx.rotate(wheelSpin);
    ctx.fillStyle = '#1E1E24';
    ctx.beginPath();
    ctx.arc(0, 0, car.wheelR, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2B2140';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = '#F3F4F6';
    ctx.beginPath();
    ctx.arc(0, 0, car.wheelR * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  drawWheel(-22, 9);
  drawWheel(22, 9);

  ctx.restore();

  // Частицы (салют, дым, осколки шариков)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.018;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Игровой цикл
function loop() {
  update();
  ctx.clearRect(0, 0, width, height);
  draw();
  requestAnimationFrame(loop);
}

initGame();
loop();
</script>
</body>
