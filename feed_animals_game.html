<html lang="ru">
<head>

<title>Накорми зверей</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#FEE140;
    --sky-2:#FA709A;
    --ink:#2B2140;
    --plate-bg:#FFFFFFE6;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    min-height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg, #FFF1EB 0%, #ACE0F9 100%);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    box-sizing:border-box;
    padding-top:max(env(safe-area-inset-top, 0px), 6px);
    padding-bottom:max(env(safe-area-inset-bottom, 0px), 8px);
    padding-left:max(env(safe-area-inset-left, 0px), 12px);
    padding-right:max(env(safe-area-inset-right, 0px), 12px);
    overflow:hidden;
  }

  /* Верхняя панель */
  .top-bar{
    width:100%;
    max-width:960px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    z-index:100;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
    border:3px solid var(--ink);
    border-radius:99px;
    color:var(--ink);
    box-shadow:0 3px 0 var(--ink);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
    font-family:'Comfortaa', cursive;
    font-weight:700;
  }
  .btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--ink);
  }
  .btn-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    padding:0;
    text-decoration:none;
    flex-shrink:0;
  }
  .btn-icon svg{ width:22px; height:22px; stroke:var(--ink); }

  .nav-group{
    display:flex;
    align-items:center;
    background:#FFFFFFE6;
    border:3px solid var(--ink);
    border-radius:99px;
    padding:2px 8px;
    box-shadow:0 3px 0 var(--ink);
    gap:8px;
  }
  .nav-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#FFF3C2;
    border:2.5px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 2px 0 var(--ink);
  }
  .animal-title{
    font-family:'Comfortaa', cursive;
    font-size:clamp(0.78rem, 2.3vmin, 0.95rem);
    font-weight:700;
    white-space:nowrap;
  }

  /* Игровая арена */
  .arena{
    flex:1;
    width:100%;
    max-width:960px;
    display:flex;
    gap:16px;
    align-items:center;
    justify-content:center;
    padding:4px 0 8px 0;
    min-height:0;
  }

  /* Место для зверька слева */
  .animal-box{
    flex:1.1;
    height:100%;
    max-height:100%;
    min-height:0;
    background:#FFFFFFD8;
    border:3.5px solid var(--ink);
    border-radius:22px;
    box-shadow:0 6px 0 var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    padding:8px;
    box-sizing:border-box;
  }
  .animal-svg-wrap{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .animal-svg-wrap svg{
    width:100%;
    height:100%;
    max-height:100%;
    object-fit:contain;
  }

  /* Анимация покачивания головой "не-а" */
  .head-shake{
    animation:shake 0.4s ease-in-out;
  }
  @keyframes shake{
    0%,100%{ transform:rotate(0deg); }
    25%{ transform:rotate(-8deg); }
    75%{ transform:rotate(8deg); }
  }

  /* Тарелка с едой справа */
  .plate-box{
    flex:0.9;
    height:100%;
    max-height:100%;
    min-height:0;
    background:var(--plate-bg);
    border:3.5px solid var(--ink);
    border-radius:22px;
    box-shadow:0 6px 0 var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-around;
    padding:10px 8px;
    box-sizing:border-box;
  }
  .plate-title{
    font-family:'Comfortaa', cursive;
    font-weight:700;
    font-size:clamp(0.75rem, 2vmin, 0.9rem);
    text-align:center;
    opacity:0.85;
  }
  .food-items-wrap{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:clamp(8px, 2vmin, 14px);
    width:100%;
    justify-items:center;
    align-items:center;
  }

  /* Карточка с едой (можно тащить) */
  .food-card{
    width:clamp(74px, 16vmin, 100px);
    height:clamp(74px, 16vmin, 100px);
    background:#FFFFFF;
    border:3.5px solid var(--ink);
    border-radius:20px;
    box-shadow:0 4px 0 var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
    transition:transform .12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index:20;
    user-select:none;
    padding:4px;
  }
  .food-card svg{
    width:84%;
    height:84%;
    max-height:68px;
    pointer-events:none;
  }
  .food-label{
    font-family:'Comfortaa', cursive;
    font-size:clamp(0.68rem, 1.8vmin, 0.82rem);
    font-weight:900;
    color:var(--ink);
    margin-top:2px;
    pointer-events:none;
    white-space:nowrap;
  }
  .food-card.dragging{
    cursor:grabbing;
    transform:scale(1.28);
    z-index:999 !important;
    box-shadow:0 12px 20px rgba(0,0,0,0.25);
  }

  /* Сердечки от радости */
  .heart-fly{
    position:absolute;
    font-size:32px;
    pointer-events:none;
    animation:fly-up 1.2s forwards;
    z-index:99;
  }
  @keyframes fly-up{
    0%{ transform:translateY(0) scale(0.6); opacity:1; }
    100%{ transform:translateY(-80px) scale(1.3); opacity:0; }
  }

  /* Салют конфетти */
  .confetti{
    position:absolute;
    pointer-events:none;
    z-index:9999;
    animation:confetti-fly 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  @keyframes confetti-fly{
    0%{ transform:translate(0, 0) scale(0.6) rotate(0); opacity:1; }
    100%{ transform:translate(var(--cx), var(--cy)) scale(1.3) rotate(600deg); opacity:0; }
  }

  /* Поворот экрана */
  .rotate-prompt{
    display:none;
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(43,33,64,0.94);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#FFFFFF;
    text-align:center;
  }
  @media screen and (orientation: portrait){
    .rotate-prompt{ display:flex; }
  }
  .rotate-card{
    background:#FFFFFF;
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:22px;
    padding:20px 24px;
    max-width:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .rotate-icon{
    width:56px;
    height:56px;
    color:#FFD23F;
    margin-bottom:10px;
    animation:phone-rotate 2.2s ease-in-out infinite;
  }
  .rotate-icon svg{ width:100%; height:100%; }
  @keyframes phone-rotate{
    0%,20%{ transform:rotate(0deg); }
    50%,70%{ transform:rotate(-90deg); }
    90%,100%{ transform:rotate(0deg); }
  }
</style>
</head>

// Web Audio API
class SoundFX {
  constructor() {
    this.ctx = null;
    this._ready = false;
  }
  // Вызывается строго из обработчика gesture (pointerdown)
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().then(() => { this._ready = true; });
    } else if (this.ctx && this.ctx.state === 'running') {
      this._ready = true;
    }
  }
  // Гарантирует, что ctx доступен и работает
  _check() {
    if (!this.ctx) return false;
    if (this.ctx.state === 'suspended') {
      this.ctx.resume();
      return false; // звук подождёт следующего тапа
    }
    return true;
  }
  // Хрум-хрум (кушает)
  crunch() {
    if (!this._check()) return;
    [0, 0.1, 0.2].forEach(delay => {
      const t = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400 + Math.random() * 200, t);
      osc.frequency.exponentialRampToValueAtTime(650, t + 0.08);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.08);
    });
  }
  // Не-а (ошибка)
  wrong() {
    if (!this._check()) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(120, this.ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.25);
  }
  // Победный джингл
  win() {
    if (!this._check()) return;
    const notes = [392, 523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const t = this.ctx.currentTime + 0.25 + i * 0.07;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.26, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    });
  }
  // Воспроизведение голоса нужного зверька (убрано)
  playAnimalVoice(id) {
    // Голоса убраны по запросу
  }
}
const sfx = new SoundFX();

function lockLandscape() {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}
window.addEventListener('load', lockLandscape);
window.addEventListener('pointerdown', () => {
  sfx.init();
  lockLandscape();
}, { once: true });

function fireConfetti() {
  const colors = ['#FF4757', '#FFA502', '#FFDD59', '#2ED573', '#1E90FF', '#FF6584'];
  const cx = window.innerWidth * 0.4;
  const cy = window.innerHeight * 0.5;
  for (let i = 0; i < 35; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const s = 10 + Math.random() * 12;
    c.style.width = s + 'px';
    c.style.height = (s * (Math.random() > 0.5 ? 1 : 0.6)) + 'px';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.left = cx + 'px';
    c.style.top = cy + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 220;
    c.style.setProperty('--cx', `${Math.cos(angle) * dist}px`);
    c.style.setProperty('--cy', `${Math.sin(angle) * dist}px`);
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1900);
  }
}

let curAnimalIdx = 0;
const animalSvgWrap = document.getElementById('animalSvgWrap');
const animalTitle = document.getElementById('animalTitle');
const foodsWrap = document.getElementById('foodsWrap');
const animalBox = document.getElementById('animalBox');

function renderAnimal(openMouth = false, playVoice = false) {
  const an = ANIMALS[curAnimalIdx];
  animalTitle.textContent = an.name;
  animalSvgWrap.innerHTML = an.svg(openMouth);
  if (playVoice) {
    sfx.playAnimalVoice(an.id);
  }
}

function renderFoods() {
  foodsWrap.innerHTML = '';
  // Показываем 4 разных блюда на тарелке (включая любимое!)
  const curFavorite = ANIMALS[curAnimalIdx].favorite;
  const allKeys = Object.keys(FOOD_TYPES);
  const options = new Set([curFavorite]);
  while (options.size < 4) {
    const rKey = allKeys[Math.floor(Math.random() * allKeys.length)];
    options.add(rKey);
  }

  Array.from(options).sort(() => Math.random() - 0.5).forEach(foodKey => {
    const food = FOOD_TYPES[foodKey];
    const card = document.createElement('div');
    card.className = 'food-card';
    card.dataset.food = food.id;
    card.innerHTML = `${food.svg}<div class="food-label">${food.name}</div>`;
    foodsWrap.appendChild(card);

    setupFoodDrag(card, food);
  });
}

function setupFoodDrag(card, food) {
  let isDragging = false;
  let startX = 0, startY = 0;
  let cardInitialX = 0, cardInitialY = 0;

  card.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    isDragging = true;
    card.classList.add('dragging');
    card.setPointerCapture(e.pointerId);

    const rect = card.getBoundingClientRect();
    cardInitialX = rect.left;
    cardInitialY = rect.top;

    startX = e.clientX;
    startY = e.clientY;

    card.style.position = 'fixed';
    card.style.left = `${cardInitialX}px`;
    card.style.top = `${cardInitialY}px`;

    // Зверёк с надеждой открывает ротик!
    renderAnimal(true);
  });

  card.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    card.style.left = `${cardInitialX + dx}px`;
    card.style.top = `${cardInitialY + dy}px`;
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');

    // Проверяем: донесли ли еду до мордочки зверька
    const animalRect = animalBox.getBoundingClientRect();
    const foodRect = card.getBoundingClientRect();
    const foodCenterX = foodRect.left + foodRect.width / 2;
    const foodCenterY = foodRect.top + foodRect.height / 2;

    const inAnimalArea = (
      foodCenterX > animalRect.left &&
      foodCenterX < animalRect.right &&
      foodCenterY > animalRect.top &&
      foodCenterY < animalRect.bottom
    );

    const an = ANIMALS[curAnimalIdx];

    if (inAnimalArea) {
      if (food.id === an.favorite) {
        // УРА! ПРАВИЛЬНАЯ ЕДА!
        card.style.display = 'none'; // еда съедена
        sfx.crunch();
        // Радостный благодарный голос зверька!
        setTimeout(() => sfx.playAnimalVoice(an.id), 240);
        sfx.win();
        fireConfetti();

        // Сердечко
        const heart = document.createElement('div');
        heart.className = 'heart-fly';
        heart.textContent = '❤️';
        heart.style.left = `${animalRect.left + animalRect.width / 2 - 16}px`;
        heart.style.top = `${animalRect.top + 50}px`;
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1200);

        // Зверёк жуёт с открытым/закрытым ротиком
        let chewToggle = true;
        const chewInterval = setInterval(() => {
          chewToggle = !chewToggle;
          renderAnimal(chewToggle);
        }, 150);

        setTimeout(() => {
          clearInterval(chewInterval);
          renderAnimal(false);
          // Переход к следующему зверьку со звуком его появления!
          curAnimalIdx = (curAnimalIdx + 1) % ANIMALS.length;
          renderAnimal(false, true);
          renderFoods();
        }, 1600);

        return;
      } else {
        // НЕПРАВИЛЬНАЯ ЕДА (не-а!)
        sfx.wrong();
        renderAnimal(false);
        animalBox.classList.add('head-shake');
        setTimeout(() => animalBox.classList.remove('head-shake'), 450);
      }
    } else {
      renderAnimal(false);
    }

    // Возврат карточки на тарелку
    card.style.position = '';
    card.style.left = '';
    card.style.top = '';
  }

  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);
}

// Тап по мордочке зверька — голос зверька!
animalBox.addEventListener('pointerdown', (e) => {
  // Только если не тащим еду
  if (e.target.closest('.food-card')) return;
  sfx.init();
  const an = ANIMALS[curAnimalIdx];
  sfx.playAnimalVoice(an.id);
  renderAnimal(true);
  setTimeout(() => renderAnimal(false), 250);
});

  e.preventDefault();
  sfx.init();
  curAnimalIdx = (curAnimalIdx - 1 + ANIMALS.length) % ANIMALS.length;
  renderAnimal(false, true);
  renderFoods();
});

  e.preventDefault();
  sfx.init();
  curAnimalIdx = (curAnimalIdx + 1) % ANIMALS.length;
  renderAnimal(false, true);
  renderFoods();
});

  e.preventDefault();
  sfx.init();
  curAnimalIdx = (curAnimalIdx + 1) % ANIMALS.length;
  renderAnimal(false, true);
  renderFoods();
});
