<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Мыльные пузыри</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#8FD3F4;
    --sky-2:#CFEFFF;
    --ink:#2B2140;
    --panel:#ffffffcc;
    --green:#3ECB71;
    --green-dark:#2CA85B;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-1), var(--sky-2) 70%, #E4F7FF 100%);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    overscroll-behavior:none;
  }
  #stage{
    position:fixed;
    inset:0;
    overflow:hidden;
  }
  .bubble{
    position:absolute;
    top:0; left:0;
    border-radius:50%;
    cursor:pointer;
    will-change:transform;
  }
  .glow{
    position:absolute; inset:0;
    border-radius:50%;
    pointer-events:none;
    background:
      radial-gradient(circle at 32% 26%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.55) 8%, rgba(255,255,255,0) 22%),
      radial-gradient(circle at 68% 74%, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 18%);
  }
  .confetti{
    position:absolute;
    top:0; left:0;
    pointer-events:none;
    will-change:transform, opacity;
  }
  #hint{
    position:absolute;
    left:50%; top:44%;
    transform:translate(-50%,-50%);
    font-family:'Comfortaa', sans-serif;
    font-weight:700;
    font-size:clamp(1rem, 3.4vmin, 1.8rem);
    color:var(--ink);
    background:var(--panel);
    padding:2.4vmin 4vmin;
    border-radius:1.6vmin;
    border:0.4vmin solid var(--ink);
    box-shadow:0 0.6vmin 0 rgba(43,33,64,0.2);
    text-align:center;
    pointer-events:none;
    transition:opacity .25s ease;
    z-index:4;
  }
  #controls{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:5;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:2vmin;
    padding:1.6vmin 3vmin calc(1.6vmin + env(safe-area-inset-bottom));
    background:var(--panel);
    backdrop-filter:blur(4px);
    border-top:0.4vmin solid var(--ink);
  }
  #stats{
    display:flex;
    flex-direction:column;
    gap:0.5vmin;
    font-weight:800;
    font-size:clamp(0.65rem, 1.7vmin, 0.85rem);
  }
  .stat{ display:flex; align-items:center; gap:0.7vmin; white-space:nowrap; }
  .stat .dot{ width:1.5vmin; height:1.5vmin; min-width:8px; min-height:8px; border-radius:50%; flex:0 0 auto; }
  .dot.pop{ background:#4CAF50; }
  .dot.miss{ background:#E4483A; }
  .dot.total{ background:#8B5CF6; }
  #actions{
    display:flex;
    align-items:center;
    gap:1.6vmin;
  }
  .roundBtn{
    width:7.4vmin; height:7.4vmin;
    min-width:48px; min-height:48px;
    max-width:64px; max-height:64px;
    border-radius:50%;
    border:0.3vmin solid var(--ink);
    background:var(--green);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 0.5vmin 0 var(--green-dark);
    transition:transform .1s ease, box-shadow .1s ease;
    padding:0;
  }
  .roundBtn:active{ transform:translateY(0.4vmin); box-shadow:0 0.1vmin 0 var(--green-dark); }
  .roundBtn svg{ width:46%; height:46%; display:block; }
</style>
</head>
<body>
<div id="stage">
  <div id="hint">Нажми ▶,<br>чтобы начать 🎈</div>
</div>
<div id="controls">
  <div id="stats">
    <div class="stat"><span class="dot pop"></span>Лопнуто: <span id="poppedCount">0</span></div>
    <div class="stat"><span class="dot miss"></span>Улетело: <span id="missedCount">0</span></div>
    <div class="stat"><span class="dot total"></span>Всего: <span id="totalCount">0</span></div>
  </div>
  <div id="actions">
    <button id="startBtn" class="roundBtn" aria-label="Старт/Пауза" type="button"></button>
    <button id="restartBtn" class="roundBtn" aria-label="Начать заново" type="button">
      <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M17.65,6.35C16.2,4.9,14.21,4,12,4c-4.42,0-7.99,3.58-7.99,8s3.57,8,7.99,8c3.73,0,6.84-2.55,7.73-6h-2.08c-0.82,2.33-3.04,4-5.65,4c-3.31,0-6-2.69-6-6s2.69-6,6-6c1.66,0,3.14,0.69,4.22,1.78L13,11h7V4L17.65,6.35z"/></svg>
    </button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var stage = document.getElementById('stage');
  var hint = document.getElementById('hint');
  var startBtn = document.getElementById('startBtn');
  var restartBtn = document.getElementById('restartBtn');
  var poppedEl = document.getElementById('poppedCount');
  var missedEl = document.getElementById('missedCount');
  var totalEl = document.getElementById('totalCount');

  var PLAY_ICON = '<svg viewBox="0 0 24 24" fill="#ffffff"><path d="M8 5v14l11-7z"/></svg>';
  var PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="#ffffff"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  startBtn.innerHTML = PLAY_ICON;

  // Берём data:URI прямо из атрибутов <audio> и дальше проигрываем через
  // new Audio(...) — надёжнее, чем cloneNode, и не зависит от того, что
  // скрытые <audio>-теги не вставлены в игровой поток.
  var SOUND_SRC = {
    pop: document.getElementById('sndPop').getAttribute('src'),
    laugh: document.getElementById('sndLaugh').getAttribute('src'),
    fart: document.getElementById('sndFart').getAttribute('src')
  };

  function playSound(key, volume){
    try{
      var a = new Audio(SOUND_SRC[key]);
      a.volume = (volume === undefined) ? 1 : volume;
      var p = a.play();
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }

  // Разблокируем аудио по первому пользовательскому жесту (нужно для
  // мобильных браузеров, которые блокируют звук до явного клика/тапа).
  var audioUnlocked = false;
  function unlockAudio(){
    if(audioUnlocked) return;
    audioUnlocked = true;
    Object.keys(SOUND_SRC).forEach(function(key){
      try{
        var a = new Audio(SOUND_SRC[key]);
        a.volume = 0;
        var p = a.play();
        if(p && p.then) p.then(function(){ a.pause(); }).catch(function(){});
      }catch(e){}
    });
  }

  // 7 расцветок пузырей, как в оригинальных префабах Ball1..Ball7.
  // Вариант 7 — "красный", особый: звук "пуканья" вместо смеха.
  var BUBBLE_TYPES = [
    { id:1, c1:'#8FD8FF', c2:'#3FA9E0' },
    { id:2, c1:'#B7F3C4', c2:'#3FC97A' },
    { id:3, c1:'#FFE38F', c2:'#F0B429' },
    { id:4, c1:'#E7B7FF', c2:'#A24BE0' },
    { id:5, c1:'#FFC2E0', c2:'#F0529C' },
    { id:6, c1:'#C4FFF2', c2:'#33C9AE' },
    { id:7, c1:'#FF6B6B', c2:'#DF1020', red:true }
  ];

  var CONFETTI_COLORS = ['#FFD23F','#E4483A','#3FA9E0','#8B5CF6','#3FC97A','#F0529C'];

  var playing = false;
  var spawnTimer = null;
  var bubbles = [];
  var rafId = null;

  var counts = { popped:0, missed:0, total:0 };

  function updateStats(){
    poppedEl.textContent = counts.popped;
    missedEl.textContent = counts.missed;
    totalEl.textContent = counts.total;
  }

  function rand(min, max){ return min + Math.random()*(max-min); }
  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

  function makeConfetti(x, y, tint){
    var n = 14;
    for(var i=0;i<n;i++){
      // ВАЖНО: все переменные частицы объявлены через let внутри цикла,
      // чтобы каждый requestAnimationFrame-коллбек анимировал СВОЙ элемент,
      // а не общий на всех (иначе все, кроме последней частицы, замирали
      // на экране навсегда).
      let el = document.createElement('div');
      el.className = 'confetti';
      let size = rand(4, 9);
      let isRound = Math.random() < 0.5;
      el.style.width = size+'px';
      el.style.height = (isRound? size : size*1.6)+'px';
      el.style.background = Math.random() < 0.6 ? tint : pick(CONFETTI_COLORS);
      el.style.borderRadius = isRound ? '50%' : '2px';
      stage.appendChild(el);

      let ang = rand(0, Math.PI*2);
      let speed = rand(60, 220);
      let vx = Math.cos(ang)*speed;
      let vy = Math.sin(ang)*speed - rand(40, 120);
      let rot = rand(0, 360);
      let rotSpeed = rand(-540, 540);
      let life = rand(0.6, 1.1);
      let startT = performance.now();

      (function step(){
        let t = (performance.now() - startT)/1000;
        if(t >= life || !el.parentNode){ if(el.parentNode) el.remove(); return; }
        let p = t/life;
        let px = x + vx*t;
        let py = y + vy*t + 0.5*520*t*t;
        rot += rotSpeed*(1/60);
        el.style.transform = 'translate('+px+'px,'+py+'px) rotate('+rot+'deg)';
        el.style.opacity = String(1 - p);
        requestAnimationFrame(step);
      })();
    }
  }

  function Bubble(){
    var size = rand(38, 92);
    var type = pick(BUBBLE_TYPES);
    var stageW = stage.clientWidth;
    var stageH = stage.clientHeight;
    var wobbleAmp = rand(10, 26);
    var margin = size/2 + wobbleAmp + 4;
    var minX = margin;
    var maxX = Math.max(margin, stageW - margin);
    var startX = rand(minX, maxX);

    var el = document.createElement('div');
    el.className = 'bubble';
    el.style.width = size+'px';
    el.style.height = size+'px';
    el.style.background =
      'radial-gradient(circle at 30% 25%, '+shade(type.c1,40)+', '+type.c1+' 45%, '+type.c2+' 100%)';
    el.style.boxShadow =
      'inset 0 -'+(size*0.12)+'px '+(size*0.22)+'px rgba(0,0,0,0.12), 0 '+(size*0.06)+'px '+(size*0.18)+'px rgba(0,60,90,0.18)';
    el.style.opacity = '0.88';

    var glow = document.createElement('div');
    glow.className = 'glow';
    el.appendChild(glow);

    stage.appendChild(el);

    this.el = el;
    this.type = type;
    this.size = size;
    this.startX = startX;
    this.y = stageH + size;
    this.speed = rand(80, 150);                 // px/сек вверх
    this.freq = rand(0.6, 1.6);                 // своя частота покачивания
    this.phase = rand(0, Math.PI*2);            // свой сдвиг фазы
    this.amp = wobbleAmp;
    this.popped = false;
    this.removed = false;
    this.spawnT = performance.now();

    counts.total++;
    updateStats();
  }

  function shade(hex, percent){
    var f = parseInt(hex.slice(1),16);
    var t = percent < 0 ? 0 : 255;
    var p = Math.abs(percent)/100;
    var R = f>>16, G = (f>>8)&0x00FF, B = f&0x0000FF;
    var r = Math.round((t-R)*p)+R;
    var g = Math.round((t-G)*p)+G;
    var b = Math.round((t-B)*p)+B;
    return '#'+(0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
  }

  Bubble.prototype.pop = function(){
    if(this.popped) return;
    this.popped = true;
    counts.popped++;
    updateStats();

    var rect = this.el.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    var cx = rect.left - stageRect.left + rect.width/2;
    var cy = rect.top - stageRect.top + rect.height/2;

    makeConfetti(cx, cy, this.type.c2);

    playSound('pop', 0.9);
    if(this.type.red){
      playSound('fart', 1.0);
    } else {
      playSound('laugh', 0.85);
    }

    var el = this.el;
    el.style.transition = 'transform .18s ease, opacity .18s ease';
    el.style.transform = el.style.transform + ' scale(1.25)';
    el.style.opacity = '0';
    var self = this;
    setTimeout(function(){
      if(el.parentNode) el.remove();
      self.removed = true;
    }, 190);
  };

  Bubble.prototype.update = function(dt, now){
    if(this.popped) return;
    this.y -= this.speed*dt;
    var t = (now - this.spawnT)/1000;
    var x = this.startX + Math.sin(t*this.freq*Math.PI + this.phase)*this.amp;
    this.el.style.transform = 'translate('+(x - this.size/2)+'px,'+(this.y - this.size/2)+'px)';

    if(this.y + this.size < -20){
      this.removed = true;
      if(this.el.parentNode) this.el.remove();
      counts.missed++;
      updateStats();
    }
  };

  function onBubbleClick(bubble){
    return function(ev){
      ev.preventDefault();
      bubble.pop();
    };
  }

  var lastTime = null;
  function loop(now){
    if(!playing){ rafId = null; return; }
    if(lastTime === null) lastTime = now;
    var dt = Math.min((now-lastTime)/1000, 0.05);
    lastTime = now;

    for(var i=bubbles.length-1; i>=0; i--){
      var b = bubbles[i];
      b.update(dt, now);
      if(b.removed) bubbles.splice(i,1);
    }
    rafId = requestAnimationFrame(loop);
  }

  function spawnLoop(){
    if(!playing) return;
    var b = new Bubble();
    b.el.addEventListener('pointerdown', onBubbleClick(b));
    bubbles.push(b);
    var delay = rand(500, 1000);
    spawnTimer = setTimeout(spawnLoop, delay);
  }

  function start(){
    unlockAudio();
    playing = true;
    hint.style.opacity = '0';
    startBtn.innerHTML = PAUSE_ICON;
    lastTime = null;
    if(!rafId) rafId = requestAnimationFrame(loop);
    spawnLoop();
  }

  function pause(){
    playing = false;
    startBtn.innerHTML = PLAY_ICON;
    if(spawnTimer){ clearTimeout(spawnTimer); spawnTimer = null; }
  }

  function clearField(){
    for(var i=0;i<bubbles.length;i++){
      if(bubbles[i].el.parentNode) bubbles[i].el.remove();
    }
    bubbles = [];
    var confettiEls = stage.querySelectorAll('.confetti');
    for(var j=0;j<confettiEls.length;j++){ confettiEls[j].remove(); }
  }

  function restart(){
    if(spawnTimer){ clearTimeout(spawnTimer); spawnTimer = null; }
    playing = false;
    clearField();
    counts.popped = 0;
    counts.missed = 0;
    counts.total = 0;
    updateStats();
    start();
  }

  startBtn.addEventListener('click', function(){
    if(playing) pause(); else start();
  });

  restartBtn.addEventListener('click', function(){
    restart();
  });

})();
</script>
</body>
</html>
