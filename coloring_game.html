<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Раскраска</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#8FD3F4;
    --sky-2:#BEE3F8;
    --ink:#2B2140;
    --panel:#FFFFFF;
    --sun:#FFD23F;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    min-height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-1), var(--sky-2));
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    box-sizing:border-box;
    padding-top:max(env(safe-area-inset-top, 0px), 6px);
    padding-bottom:max(env(safe-area-inset-bottom, 0px), 8px);
    padding-left:max(env(safe-area-inset-left, 0px), 12px);
    padding-right:max(env(safe-area-inset-right, 0px), 12px);
    overflow:hidden;
  }

  /* Верхняя панель */
  .top-bar{
    width:100%;
    max-width:960px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    z-index:10;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
    border:3px solid var(--ink);
    border-radius:99px;
    color:var(--ink);
    box-shadow:0 4px 0 var(--ink);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
    font-family:'Comfortaa', cursive;
    font-weight:700;
  }
  .btn:active{
    transform:translateY(3px);
    box-shadow:0 1px 0 var(--ink);
  }
  .btn-icon{
    width:42px;
    height:42px;
    border-radius:50%;
    padding:0;
    text-decoration:none;
    flex-shrink:0;
  }
  .btn-icon svg{
    width:22px;
    height:22px;
    stroke:var(--ink);
  }
  .nav-group{
    display:flex;
    align-items:center;
    background:#FFFFFFE6;
    border:3px solid var(--ink);
    border-radius:99px;
    padding:2px 6px;
    box-shadow:0 4px 0 var(--ink);
    gap:6px;
  }
  .nav-btn{
    width:34px;
    height:34px;
    border-radius:50%;
    background:#FFF3C2;
    border:2.5px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 2px 0 var(--ink);
    transition:transform .1s ease;
  }
  .nav-btn:active{
    transform:translateY(2px);
    box-shadow:none;
  }
  .pic-title{
    font-size:clamp(0.75rem, 2.4vmin, 0.95rem);
    font-weight:800;
    padding:0 4px;
    white-space:nowrap;
  }

  /* Центральная часть с рисунком */
  .canvas-wrap{
    position:relative;
    flex:1;
    width:100%;
    max-width:820px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 0 8px 0;
    min-height:0; /* важно для flex в ландшафте */
  }
  .drawing-board{
    background:#FFFFFF;
    border:3.5px solid var(--ink);
    border-radius:18px;
    box-shadow:0 6px 0 var(--ink);
    width:100%;
    height:100%;
    max-height:100%;
    min-height:0;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:6px;
    position:relative;
  }
  .drawing-board svg{
    width:100%;
    height:100%;
    max-height:100%;
    object-fit:contain;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,0.06));
  }

  /* Красивые кликабельные секции SVG */
  .paintable{
    cursor:pointer;
    transition:fill 0.18s ease-out, transform 0.1s ease;
    stroke:#2B2140;
    stroke-width:4.5;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .paintable:active{
    filter:brightness(1.1);
  }
  .outline-only{
    stroke:#2B2140;
    stroke-width:4.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    fill:none;
    pointer-events:none;
  }

  /* Нижняя палитра красок */
  .palette-bar{
    width:100%;
    max-width:960px;
    background:#FFFFFFE8;
    border:3px solid var(--ink);
    border-radius:24px;
    padding:4px 10px;
    box-shadow:0 4px 0 var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(6px, 1.8vmin, 14px);
    z-index:10;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .palette-bar::-webkit-scrollbar{ display:none; }
  .color-btn{
    width:clamp(32px, 8vmin, 44px);
    height:clamp(32px, 8vmin, 44px);
    border-radius:50%;
    border:3px solid var(--ink);
    box-shadow:0 3px 0 var(--ink);
    cursor:pointer;
    flex-shrink:0;
    position:relative;
    transition:transform .15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .15s ease;
  }
  .color-btn::after{
    content:'';
    position:absolute;
    inset:2px;
    border-radius:50%;
    background:inherit;
  }
  .color-btn.active{
    transform:translateY(-6px) scale(1.18);
    box-shadow:0 8px 0 var(--ink);
    outline:3px solid #FFF3BE;
  }
  .color-btn.active::before{
    content:'✔';
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(14px, 3.5vmin, 20px);
    color:#FFFFFF;
    text-shadow:0 1px 3px rgba(0,0,0,0.8), 0 0 2px #000;
    z-index:2;
  }

  /* Эффект брызг и салюта */
  .particle{
    position:absolute;
    pointer-events:none;
    border-radius:50%;
    z-index:99;
    animation:splash .5s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }
  @keyframes splash{
    0%{ transform:translate(-50%, -50%) scale(0.3); opacity:1; }
    100%{ transform:translate(var(--tx), var(--ty)) scale(1.2); opacity:0; }
  }

  /* Салют победы */
  .confetti{
    position:absolute;
    pointer-events:none;
    z-index:9999;
    animation:confetti-fall 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translate(0, 0) rotate(0deg) scale(0.6); opacity:1; }
    100%{ transform:translate(var(--cx), var(--cy)) rotate(720deg) scale(1.2); opacity:0; }
  }

  /* Экран поворота устройства */
  .rotate-prompt{
    display:none;
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(43,33,64,0.94);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#FFFFFF;
    text-align:center;
  }
  @media screen and (orientation: portrait){
    .rotate-prompt{ display:flex; }
  }
  .rotate-card{
    background:#FFFFFF;
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:22px;
    padding:20px 24px;
    max-width:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .rotate-icon{
    width:56px;
    height:56px;
    color:#FFD23F;
    margin-bottom:10px;
    animation:phone-rotate 2.2s ease-in-out infinite;
  }
  .rotate-icon svg{ width:100%; height:100%; }
  @keyframes phone-rotate{
    0%,20%{ transform:rotate(0deg); }
    50%,70%{ transform:rotate(-90deg); }
    90%,100%{ transform:rotate(0deg); }
  }
  .rotate-title{

    font-weight:700;
    font-size:1.2rem;
    margin-bottom:6px;
  }
  .rotate-sub{
    font-size:0.88rem;
    opacity:0.85;
  }
</style>
</head>

// Аудиосинтезатор Web Audio API (без внешних файлов)
class SoundFX {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  pop(freq = 440) {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
  }
  fanfare() {
    this.init();
    if (!this.ctx) return;
    const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
    notes.forEach((freq, idx) => {
      const t = this.ctx.currentTime + idx * 0.09;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(0.28, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.25);
    });
  }
}
const sfx = new SoundFX();

// Попытка зафиксировать альбомную ориентацию на Android
function lockLandscape() {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}
window.addEventListener('load', lockLandscape);

let curPicIdx = 0;

// Инициализация палитры
const paletteEl = document.getElementById('palette');
COLORS.forEach((col, idx) => {
  const btn = document.createElement('button');
  btn.className = 'color-btn' + (idx === 0 ? ' active' : '');
  btn.style.backgroundColor = col.val;
  btn.title = col.name;
  btn.setAttribute('aria-label', col.name);
  btn.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedColor = col.val;
    sfx.pop(350 + idx * 30);
  });
  paletteEl.appendChild(btn);
});

// Загрузка картинки
const boardEl = document.getElementById('board');
const picTitleEl = document.getElementById('picTitle');

function loadPicture(idx) {
  curPicIdx = (idx + PICTURES.length) % PICTURES.length;
  const pic = PICTURES[curPicIdx];
  picTitleEl.textContent = `${pic.title} (${curPicIdx + 1}/${PICTURES.length})`;
  boardEl.innerHTML = pic.svg;
  attachPaintHandlers();
}

// Привязка кликов к раскрашиваемым зонам
function attachPaintHandlers() {
  const elements = boardEl.querySelectorAll('.paintable');
  elements.forEach((elem) => {
    elem.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      elem.setAttribute('fill', selectedColor);

      // Звуковой эффект с легкой случайной тональностью
      sfx.pop(400 + Math.random() * 200);

      // Эффект всплеска
      createSplash(e.clientX, e.clientY, selectedColor);
    });
  });
}

// Брызги при тапе
function createSplash(x, y, color) {
  for (let i = 0; i < 6; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = 8 + Math.random() * 10;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.backgroundColor = color;
    p.style.left = x + 'px';
    p.style.top = y + 'px';

    const angle = (Math.PI * 2 * i) / 6 + (Math.random() - 0.5) * 0.5;
    const dist = 20 + Math.random() * 30;
    p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

    document.body.appendChild(p);
    setTimeout(() => p.remove(), 550);
  }
}

// Салют / поздравление
function launchConfetti() {
  sfx.fanfare();
  const colors = ['#FF4757', '#FFA502', '#FFDD59', '#2ED573', '#1E90FF', '#FF6584'];
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const size = 10 + Math.random() * 14;
    c.style.width = size + 'px';
    c.style.height = (size * (Math.random() > 0.5 ? 1 : 0.6)) + 'px';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.left = centerX + 'px';
    c.style.top = centerY + 'px';

    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * (Math.min(window.innerWidth, window.innerHeight) * 0.45);
    c.style.setProperty('--cx', `${Math.cos(angle) * dist}px`);
    c.style.setProperty('--cy', `${Math.sin(angle) * dist}px`);

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2300);
  }
}

// Переключение картинок
document.getElementById('prevBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pop(300);
  loadPicture(curPicIdx - 1);
});
document.getElementById('nextBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pop(500);
  loadPicture(curPicIdx + 1);
});

// Кнопка очистить
document.getElementById('clearBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pop(250);
  loadPicture(curPicIdx);
});

// Кнопка салюта
document.getElementById('cheerBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  launchConfetti();
});

// Первая загрузка
loadPicture(0);
