<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Пазлы для малышей</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#85D8CE;
    --sky-2:#085078;
    --ink:#2B2140;
    --sun:#FFD23F;
    --tray-bg:#FFF8E7;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{
    width:100%; height:100%;
    min-height:100%;
    overflow:hidden;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg, #A8EDEA 0%, #FED6E3 100%);
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    align-items:center;
    box-sizing:border-box;
    padding-top:max(env(safe-area-inset-top, 0px), 6px);
    padding-bottom:max(env(safe-area-inset-bottom, 0px), 8px);
    padding-left:max(env(safe-area-inset-left, 0px), 12px);
    padding-right:max(env(safe-area-inset-right, 0px), 12px);
    overflow:hidden;
  }

  /* Верхняя панель */
  .top-bar{
    width:100%;
    max-width:960px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    z-index:100;
  }
  .btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFF;
    border:3px solid var(--ink);
    border-radius:99px;
    color:var(--ink);
    box-shadow:0 3px 0 var(--ink);
    cursor:pointer;
    transition:transform .1s ease, box-shadow .1s ease;
    font-family:'Comfortaa', cursive;
    font-weight:700;
  }
  .btn:active{
    transform:translateY(2px);
    box-shadow:0 1px 0 var(--ink);
  }
  .btn-icon{
    width:40px;
    height:40px;
    border-radius:50%;
    padding:0;
    text-decoration:none;
    flex-shrink:0;
  }
  .btn-icon svg{ width:22px; height:22px; stroke:var(--ink); }

  .nav-group{
    display:flex;
    align-items:center;
    background:#FFFFFFE6;
    border:3px solid var(--ink);
    border-radius:99px;
    padding:2px 8px;
    box-shadow:0 3px 0 var(--ink);
    gap:8px;
  }
  .nav-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    background:#FFF3C2;
    border:2.5px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 2px 0 var(--ink);
  }
  .level-title{
    font-family:'Comfortaa', cursive;
    font-size:clamp(0.78rem, 2.3vmin, 0.95rem);
    font-weight:700;
    white-space:nowrap;
  }

  /* Игровая арена */
  .puzzle-arena{
    flex:1;
    width:100%;
    max-width:960px;
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
    padding:4px 0 8px 0;
    min-height:0;
  }

  /* Рамка сборки (слева) */
  .target-frame{
    flex:1.2;
    height:100%;
    max-height:100%;
    min-height:0;
    box-sizing:border-box;
    background:#FFFFFF;
    border:3.5px solid var(--ink);
    border-radius:20px;
    box-shadow:0 6px 0 var(--ink);
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px;
  }
  #targetSvg{
    width:100%;
    height:100%;
    max-height:100%;
    object-fit:contain;
  }

  /* Лоток с деталями (справа) — 3 столбца x 2 ряда для 6 деталей */
  .pieces-tray{
    flex:0.85;
    height:100%;
    max-height:100%;
    min-height:0;
    box-sizing:border-box;
    background:var(--tray-bg);
    border:3.5px dashed var(--ink);
    border-radius:20px;
    box-shadow:0 6px 0 var(--ink);
    position:relative;
    overflow:hidden;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:8px;
    padding:8px;
    align-items:center;
    justify-items:center;
  }

  /* Слот под деталь в лотке */
  .piece-slot{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#FFFFFFCC;
    border:2px dashed rgba(43,33,64,0.25);
    border-radius:12px;
    position:relative;
    padding:2px;
  }

  /* Деталь пазла */
  .puzzle-piece{
    width:94%;
    height:94%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    touch-action:none;
    user-select:none;
    transition:transform .12s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    filter:drop-shadow(0 3px 5px rgba(0,0,0,0.18));
  }
  .puzzle-piece svg{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
  }
  .puzzle-piece.dragging{
    cursor:grabbing;
    transform:scale(1.28);
    z-index:9999 !important;
    filter:drop-shadow(0 12px 20px rgba(0,0,0,0.3));
  }
  .puzzle-piece.placed{
    opacity:0.18;
    pointer-events:none;
    filter:grayscale(0.8);
  }

  /* Силуэты в рамке сборки */
  .slot-ghost{
    opacity:0.18;
    fill:#2B2140;
    stroke:#2B2140;
    stroke-width:3;
  }
  .slot-active{
    transition:opacity 0.25s ease-out;
  }

  /* МОДАЛЬНОЕ ОКНО ПОБЕДЫ БЕЗ БУКВ */
  .win-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(43,33,64,0.65);
    backdrop-filter:blur(4px);
    z-index:99999;
    align-items:center;
    justify-content:center;
    padding:20px;
    animation:fadeIn 0.3s ease;
  }
  @keyframes fadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  .win-card{
    background:#FFFFFF;
    border:4px solid var(--ink);
    border-radius:28px;
    padding:20px 32px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 12px 32px rgba(0,0,0,0.35);
    animation:popModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popModal{
    from{ transform:scale(0.5); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }
  .win-star-badge{
    font-size:clamp(56px, 14vmin, 84px);
    animation:starPulse 1.2s infinite alternate ease-in-out;
    filter:drop-shadow(0 4px 10px rgba(255,210,63,0.6));
    margin-bottom:12px;
  }
  @keyframes starPulse{
    from{ transform:scale(1) rotate(-5deg); }
    to{ transform:scale(1.18) rotate(5deg); }
  }
  .win-actions{
    display:flex;
    gap:20px;
    align-items:center;
  }
  .win-action-btn{
    width:clamp(64px, 14vmin, 84px);
    height:clamp(64px, 14vmin, 84px);
    border-radius:50%;
    border:4px solid var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .win-action-btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 var(--ink);
  }
  .btn-retry{
    background:#FFD23F;
  }
  .btn-next{
    background:#2ED573;
  }
  .win-action-btn svg{
    width:55%;
    height:55%;
    stroke:var(--ink);
    fill:none;
  }

  /* Победный салют */
  .confetti{
    position:absolute;
    pointer-events:none;
    z-index:9999;
    animation:confetti-fly 2s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
  }
  @keyframes confetti-fly{
    0%{ transform:translate(0, 0) scale(0.6) rotate(0); opacity:1; }
    100%{ transform:translate(var(--cx), var(--cy)) scale(1.3) rotate(600deg); opacity:0; }
  }

  /* Поворот экрана */
  .rotate-prompt{
    display:none;
    position:fixed;
    inset:0;
    z-index:99999;
    background:rgba(43,33,64,0.94);
    backdrop-filter:blur(6px);
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#FFFFFF;
    text-align:center;
  }
  @media screen and (orientation: portrait){
    .rotate-prompt{ display:flex; }
  }
  .rotate-card{
    background:#FFFFFF;
    color:var(--ink);
    border:4px solid var(--ink);
    border-radius:22px;
    padding:20px 24px;
    max-width:300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
  }
  .rotate-icon{
    width:56px;
    height:56px;
    color:#FFD23F;
    margin-bottom:10px;
    animation:phone-rotate 2.2s ease-in-out infinite;
  }
  .rotate-icon svg{ width:100%; height:100%; }
  @keyframes phone-rotate{
    0%,20%{ transform:rotate(0deg); }
    50%,70%{ transform:rotate(-90deg); }
    90%,100%{ transform:rotate(0deg); }
  }
</style>
</head>

<script>
class SoundFX {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }
  pickup() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(480, this.ctx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.08);
  }
  snap() {
    this.init();
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(950, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.32, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.14);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.14);
  }
  horn() {
    this.init();
    if (!this.ctx) return;
    [0, 0.18].forEach(delay => {
      const t = this.ctx.currentTime + delay;
      const osc1 = this.ctx.createOscillator();
      const osc2 = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc1.type = 'sawtooth';
      osc2.type = 'sawtooth';
      osc1.frequency.setValueAtTime(311.13, t);
      osc2.frequency.setValueAtTime(392.00, t);
      gain.gain.setValueAtTime(0.18, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(this.ctx.destination);
      osc1.start(t);
      osc2.start(t);
      osc1.stop(t + 0.14);
      osc2.stop(t + 0.14);
    });
  }
  win() {
    this.init();
    this.horn();
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const t = this.ctx.currentTime + 0.4 + i * 0.08;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    });
  }
}
const sfx = new SoundFX();

function lockLandscape() {
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(() => {});
  }
}
window.addEventListener('load', lockLandscape);
window.addEventListener('pointerdown', () => {
  sfx.init();
  lockLandscape();
}, { once: true });

function fireConfetti() {
  const colors = ['#FF4757', '#FFA502', '#FFDD59', '#2ED573', '#1E90FF', '#9D4EDD'];
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  for (let i = 0; i < 40; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    const s = 10 + Math.random() * 12;
    c.style.width = s + 'px';
    c.style.height = (s * (Math.random() > 0.5 ? 1 : 0.6)) + 'px';
    c.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
    c.style.left = cx + 'px';
    c.style.top = cy + 'px';
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 260;
    c.style.setProperty('--cx', `${Math.cos(angle) * dist}px`);
    c.style.setProperty('--cy', `${Math.sin(angle) * dist}px`);
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2100);
  }
}

let curPuzzleIdx = 0;
let placedCount = 0;

const targetSvg = document.getElementById('targetSvg');
const piecesTray = document.getElementById('piecesTray');
const puzzleTitle = document.getElementById('puzzleTitle');
const winOverlay = document.getElementById('winOverlay');

function loadPuzzle(idx) {
  curPuzzleIdx = (idx + PUZZLES.length) % PUZZLES.length;
  const p = PUZZLES[curPuzzleIdx];
  puzzleTitle.textContent = p.title;
  placedCount = 0;
  winOverlay.style.display = 'none';

  targetSvg.innerHTML = '';
  piecesTray.innerHTML = '';

  // 1. Создаем силуэты и скрытые активные части в targetSvg
  p.pieces.forEach(piece => {
    const ghost = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    ghost.id = `ghost_${piece.id}`;
    ghost.className.baseVal = 'slot-ghost';
    ghost.innerHTML = piece.svg;
    targetSvg.appendChild(ghost);

    const active = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    active.id = `active_${piece.id}`;
    active.className.baseVal = 'slot-active';
    active.style.opacity = '0';
    active.innerHTML = piece.svg;
    targetSvg.appendChild(active);
  });

  // 2. Создаем 6 слотов в лотке справа
  p.pieces.forEach(piece => {
    const slot = document.createElement('div');
    slot.className = 'piece-slot';

    const pieceEl = document.createElement('div');
    pieceEl.className = 'puzzle-piece';
    pieceEl.id = `tray_${piece.id}`;
    pieceEl.dataset.id = piece.id;
    pieceEl.innerHTML = piece.previewSvg;

    setupDrag(pieceEl, piece);

    slot.appendChild(pieceEl);
    piecesTray.appendChild(slot);
  });
}

function setupDrag(pieceEl, piece) {
  let isDragging = false;
  let startX = 0, startY = 0;
  let initialLeft = 0, initialTop = 0;

  pieceEl.addEventListener('pointerdown', (e) => {
    if (pieceEl.classList.contains('placed')) return;
    e.preventDefault();
    sfx.pickup();
    isDragging = true;

    pieceEl.classList.add('dragging');
    pieceEl.setPointerCapture(e.pointerId);

    const rect = pieceEl.getBoundingClientRect();
    initialLeft = rect.left;
    initialTop = rect.top;

    startX = e.clientX;
    startY = e.clientY;

    pieceEl.style.position = 'fixed';
    pieceEl.style.left = `${initialLeft}px`;
    pieceEl.style.top = `${initialTop}px`;
    pieceEl.style.width = `${rect.width}px`;
    pieceEl.style.height = `${rect.height}px`;
  });

  pieceEl.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    pieceEl.style.left = `${initialLeft + dx}px`;
    pieceEl.style.top = `${initialTop + dy}px`;
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    pieceEl.classList.remove('dragging');

    const targetRect = document.getElementById('targetFrame').getBoundingClientRect();
    const pieceRect = pieceEl.getBoundingClientRect();
    const pieceCenterX = pieceRect.left + pieceRect.width / 2;
    const pieceCenterY = pieceRect.top + pieceRect.height / 2;

    const insideTargetFrame = (
      pieceCenterX > targetRect.left &&
      pieceCenterX < targetRect.right &&
      pieceCenterY > targetRect.top &&
      pieceCenterY < targetRect.bottom
    );

    if (insideTargetFrame) {
      sfx.snap();
      pieceEl.classList.add('placed');
      pieceEl.style.position = '';
      pieceEl.style.left = '';
      pieceEl.style.top = '';
      pieceEl.style.width = '';
      pieceEl.style.height = '';

      const ghost = document.getElementById(`ghost_${piece.id}`);
      const active = document.getElementById(`active_${piece.id}`);
      if (ghost) ghost.style.display = 'none';
      if (active) active.style.opacity = '1';

      placedCount++;

      // Проверка полной победы
      if (placedCount === PUZZLES[curPuzzleIdx].pieces.length) {
        setTimeout(() => {
          sfx.win();
          fireConfetti();
          // Показываем окно победы без букв
          setTimeout(() => {
            winOverlay.style.display = 'flex';
          }, 800);
        }, 150);
      }
    } else {
      pieceEl.style.position = '';
      pieceEl.style.left = '';
      pieceEl.style.top = '';
      pieceEl.style.width = '';
      pieceEl.style.height = '';
    }
  }

  pieceEl.addEventListener('pointerup', endDrag);
  pieceEl.addEventListener('pointercancel', endDrag);
}

// Кнопки модалки победы
document.getElementById('modalRetryBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pickup();
  loadPuzzle(curPuzzleIdx);
});
document.getElementById('modalNextBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pickup();
  loadPuzzle(curPuzzleIdx + 1);
});

// Навигация верхней панели
document.getElementById('prevBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pickup();
  loadPuzzle(curPuzzleIdx - 1);
});
document.getElementById('nextBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pickup();
  loadPuzzle(curPuzzleIdx + 1);
});
document.getElementById('resetBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  sfx.pickup();
  loadPuzzle(curPuzzleIdx);
});

// Старт
loadPuzzle(0);
