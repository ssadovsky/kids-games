name: Build Android app (TWA / Bubblewrap)

on:
  workflow_dispatch: {}
  push:
    branches: [ main, master ]
    paths:
      - "twa-manifest.json"
      - "manifest.json"
      - "icon-*.png"
      - ".github/workflows/build-twa.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK layout and build tools for Bubblewrap
        run: |
          # Bubblewrap CLI expects $ANDROID_HOME/tools or $ANDROID_HOME/bin to exist
          CMDLINE_DIR=$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          sudo ln -sf "$CMDLINE_DIR" "$ANDROID_HOME/tools"
          sudo ln -sf "$CMDLINE_DIR/bin" "$ANDROID_HOME/bin"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;36.1.0" > /dev/null || true
          # Ensure build-tools/36.1.0 directory exists for Bubblewrap
          LATEST_BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ ! -d "$ANDROID_HOME/build-tools/36.1.0" ] && [ -n "$LATEST_BT" ]; then
            sudo ln -sf "$LATEST_BT" "$ANDROID_HOME/build-tools/36.1.0"
          fi

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-upload.keystore

      - name: Point Bubblewrap at the already-installed JDK/Android SDK
        # Without this, `bubblewrap update`/`build` interactively asks
        # "Do you want Bubblewrap to install the JDK?" and hangs forever
        # in CI (no stdin), failing with exit code 130.
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat "$HOME/.bubblewrap/config.json"

      - name: Serve local icons for Bubblewrap
        run: |
          python3 -m http.server 8080 &
          sleep 1
          sed -i 's|https://ssadovsky.github.io/kids-games/icon-512.png|http://localhost:8080/icon-512.png|g' twa-manifest.json
          sed -i 's|https://ssadovsky.github.io/kids-games/icon-512-maskable.png|http://localhost:8080/icon-512-maskable.png|g' twa-manifest.json

      - name: Regenerate Android project from twa-manifest.json
        run: |
          # Feed blank lines as a safety net: any leftover interactive prompt
          # just accepts bubblewrap's default (== the value already in
          # twa-manifest.json), instead of hanging forever with no input.
          printf '%.0s\n' {1..30} > /tmp/answers.txt
          bubblewrap update --manifest=./twa-manifest.json --skipVersionUpgrade < /tmp/answers.txt

      - name: Build signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          printf '%.0s\n' {1..30} > /tmp/answers.txt
          bubblewrap build --skipPwaValidation < /tmp/answers.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kids-games-android-build
          path: |
            app-release-bundle.aab
            app-release-signed.apk
          if-no-files-found: error

      - name: Prepare release files
        run: cp app-release-signed.apk app-release.apk

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            app-release.apk
            app-release-signed.apk
            app-release-bundle.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove keystore from runner workspace
        if: always()
        run: rm -f android-upload.keystore
