<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Игры</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@500;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1:#8FD3F4;
    --sky-2:#B6E6FF;
    --card-bg:#FFFFFF;
    --ink:#2B2140;
    --sun:#FFD23F;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family:'Nunito', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-1), var(--sky-2) 60%, #CFEFC9 60%, #9FDB8F 100%);
    background-attachment:fixed;
  }
  .wrap{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:4vmin 4vmin 6vmin;
  }
  h1{
    font-family:'Comfortaa', sans-serif;
    font-weight:700;
    font-size:clamp(1.6rem, 5vmin, 2.6rem);
    margin:2vmin 0 1vmin;
    text-align:center;
    text-shadow:0 2px 0 rgba(255,255,255,0.6);
  }
  .sun{
    position:absolute;
    top:4vmin; right:6vmin;
    width:10vmin; height:10vmin;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFF3C2, var(--sun) 70%);
    box-shadow:0 0 4vmin rgba(255,210,63,0.55);
  }
  .cloud{
    position:absolute;
    background:#fff;
    border-radius:99px;
    opacity:0.9;
  }
  .cloud::before, .cloud::after{
    content:"";
    position:absolute;
    background:#fff;
    border-radius:50%;
  }
  .cloud1{ top:8vmin; left:6vmin; width:10vmin; height:4vmin; }
  .cloud1::before{ width:5vmin; height:5vmin; top:-2.6vmin; left:1vmin; }
  .cloud1::after{ width:4vmin; height:4vmin; top:-2vmin; left:5.4vmin; }
  .grid{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 220px));
    gap:3vmin;
    justify-content:center;
    max-width:1000px;
    width:100%;
    margin-top:2vmin;
  }
  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    background:var(--card-bg);
    border:0.4vmin solid var(--ink);
    border-radius:1.6vmin;
    padding:3vmin 2vmin 2.2vmin;
    text-decoration:none;
    color:var(--ink);
    box-shadow:0 0.6vmin 0 rgba(43,33,64,0.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:active{
    transform:translateY(0.4vmin);
    box-shadow:0 0.2vmin 0 rgba(43,33,64,0.18);
  }
  @media(hover:hover){
    .card:hover{
      transform:translateY(-0.4vmin);
      box-shadow:0 1vmin 0 rgba(43,33,64,0.18);
    }
  }
  .icon{ width:16vmin; max-width:120px; height:16vmin; max-height:120px; }
  .card-title{
    font-family:'Comfortaa', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    margin-top:1.6vmin;
    text-align:center;
  }
  .card-sub{
    font-size:0.85rem;
    opacity:0.65;
    margin-top:0.4vmin;
    text-align:center;
  }
  .card.soon{
    opacity:0.55;
    border-style:dashed;
    cursor:default;
  }
  .card.soon .card-title{ opacity:0.8; }
  footer{
    margin-top:auto;
    padding-top:4vmin;
    font-size:0.8rem;
    opacity:0.6;
    text-align:center;
  }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="cloud cloud1"></div>
  <div class="wrap">
    <h1>Выбери игру 🎮</h1>
    <div class="grid">

      <a class="card" href="build_house_game.html">
        <svg class="icon" viewBox="0 0 120 120">
          <polygon points="10,58 60,20 110,58" fill="#E4483A" stroke="#2B2140" stroke-width="5" stroke-linejoin="round"/>
          <rect x="22" y="56" width="76" height="46" fill="#F3DFB4" stroke="#2B2140" stroke-width="5"/>
          <rect x="34" y="66" width="16" height="16" rx="2" fill="#CFEFEC" stroke="#2B2140" stroke-width="3"/>
          <rect x="70" y="66" width="16" height="16" rx="2" fill="#CFEFEC" stroke="#2B2140" stroke-width="3"/>
          <rect x="52" y="78" width="16" height="24" rx="2" fill="#8B5CF6" stroke="#2B2140" stroke-width="3"/>
          <circle cx="65" cy="90" r="1.6" fill="#2B2140"/>
        </svg>
        <div class="card-title">Стройка</div>
        <div class="card-sub">строим домик у моря</div>
      </a>

      <div class="card soon">
        <svg class="icon" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="46" fill="#EDEAE2" stroke="#2B2140" stroke-width="5" stroke-dasharray="8 8"/>
          <text x="60" y="70" font-size="40" text-anchor="middle" fill="#2B2140" font-family="Nunito, sans-serif" font-weight="800">?</text>
        </svg>
        <div class="card-title">Скоро</div>
        <div class="card-sub">новая игра в разработке</div>
      </div>

    </div>
    <footer>сделано с любовью 💛</footer>
  </div>
</body>
</html>
